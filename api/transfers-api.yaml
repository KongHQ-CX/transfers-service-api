---
openapi: "3.0.0"
info:
  title: "Transfers API"
  description: "This API handles transfers between accounts."
  version: "1.0.0"
servers:
- url: "https://api.example.com"
consumes:
- "application/json"
produces:
- "application/json"
schemes:
- "HTTPS"
- "HTTP"
paths:
  /health:
    x-amf-displayName: "Health Check"
    description: "Health check endpoints for monitoring service status"
    get:
      operationId: "Check service health status"
      description: "Returns the health status of the service and its dependencies\
        \ (accounts and transactions services)"
      responses:
        200:
          description: "Service and all dependencies are healthy"
          content:
            application/json:
              schema:
                description: "Response containing the health status of the service\
                  \ and its dependencies"
                x-amf-examples:
                  example_0:
                    status: "UP"
                    account_service: "UP"
                    transaction_service: "UP"
                    message: "All services operational"
                  all_healthy:
                    status: "UP"
                    account_service: "UP"
                    transaction_service: "UP"
                    message: "All services operational"
                  partial_outage:
                    status: "DOWN"
                    account_service: "DOWN"
                    transaction_service: "UP"
                    message: "One or more services are unavialable"
                type: "object"
                additionalProperties: true
                required:
                - "status"
                - "account_service"
                - "transaction_service"
                - "message"
                properties:
                  status:
                    description: "Overall health status of the transfer service"
                    example: "UP"
                    type: "string"
                  account_service:
                    description: "Health status of the account service dependency"
                    example: "UP"
                    type: "string"
                  transaction_service:
                    description: "Health status of the transaction service dependency"
                    example: "UP"
                    type: "string"
                  message:
                    description: "Human-readable description of the health status"
                    example: "All services operational"
                    type: "string"
        503:
          description: "One or more services are unhealthy"
          content:
            application/json:
              schema:
                description: "Response containing the health status of the service\
                  \ and its dependencies"
                x-amf-examples:
                  example_0:
                    status: "UP"
                    account_service: "UP"
                    transaction_service: "UP"
                    message: "All services operational"
                  all_healthy:
                    status: "UP"
                    account_service: "UP"
                    transaction_service: "UP"
                    message: "All services operational"
                  partial_outage:
                    status: "DOWN"
                    account_service: "DOWN"
                    transaction_service: "UP"
                    message: "One or more services are unavialable"
                type: "object"
                additionalProperties: true
                required:
                - "status"
                - "account_service"
                - "transaction_service"
                - "message"
                properties:
                  status:
                    description: "Overall health status of the transfer service"
                    example: "UP"
                    type: "string"
                  account_service:
                    description: "Health status of the account service dependency"
                    example: "UP"
                    type: "string"
                  transaction_service:
                    description: "Health status of the transaction service dependency"
                    example: "UP"
                    type: "string"
                  message:
                    description: "Human-readable description of the health status"
                    example: "All services operational"
                    type: "string"
    head:
      operationId: "Check service health (HEAD)"
      description: "Returns the service health status without response body"
      responses:
        200:
          description: "Service is healthy"
          content: {}
        503:
          description: "One or more services are unhealthy"
          content: {}
  /transfers:
    x-amf-displayName: "Transfers"
    description: "Operations related to fund transfers between accounts"
    post:
      operationId: "Initiate a new transfer"
      description: "Creates a new funds transfer from one account to another. Validates\
        \ accounts, debits source account, and credits destination account."
      requestBody:
        content:
          application/json:
            schema:
              description: "Transfer details including source account, destination\
                \ account, and amount"
              x-amf-examples:
                valid_transfer:
                  from_account_id: "123e4567-e89b-12d3-a456-426614174000"
                  to_account_id: "987fcdeb-51a2-43e7-89bc-765432198765"
                  amount: 100.0
              type: "object"
              additionalProperties: true
              required:
              - "from_account_id"
              - "to_account_id"
              - "amount"
              properties:
                from_account_id:
                  description: "The UUID of the source account"
                  example: "123e4567-e89b-12d3-a456-426614174000"
                  type: "string"
                to_account_id:
                  description: "The UUID of the destination account"
                  example: "987fcdeb-51a2-43e7-89bc-765432198765"
                  type: "string"
                amount:
                  description: "The amount to transfer (must be positive and have\
                    \ no more than 2 decimal places)"
                  example: 100.0
                  type: "number"
      responses:
        201:
          description: "Transfer initiated successfully"
          content:
            application/json:
              schema:
                description: "Represents a transfer between accounts including its\
                  \ current status"
                x-amf-examples:
                  example_0:
                    transfer_id: "txf-123e4567-e89b-12d3-a456-426614174000"
                    status: "completed"
                    from_account_id: "123e4567-e89b-12d3-a456-426614174000"
                    to_account_id: "987fcdeb-51a2-43e7-89bc-765432198765"
                    amount: 100.0
                    timestamp: "2024-01-15T14:30:00Z"
                  successful_transfer:
                    transfer_id: "txf-123e4567-e89b-12d3-a456-426614174000"
                    status: "completed"
                    from_account_id: "123e4567-e89b-12d3-a456-426614174000"
                    to_account_id: "987fcdeb-51a2-43e7-89bc-765432198765"
                    amount: 100.0
                    timestamp: "2024-01-15T14:30:00Z"
                  completed_transfer:
                    transfer_id: "txf-123e4567-e89b-12d3-a456-426614174000"
                    status: "completed"
                    from_account_id: "123e4567-e89b-12d3-a456-426614174000"
                    to_account_id: "987fcdeb-51a2-43e7-89bc-765432198765"
                    amount: 100.0
                    timestamp: "2024-01-15T14:30:00Z"
                type: "object"
                additionalProperties: true
                required:
                - "transfer_id"
                - "status"
                - "from_account_id"
                - "to_account_id"
                - "amount"
                - "timestamp"
                properties:
                  transfer_id:
                    description: "Unique identifier for the transfer (UUID v4)"
                    example: "txf-123e4567-e89b-12d3-a456-426614174000"
                    type: "string"
                  status:
                    description: "The current status of the transfer"
                    enum:
                    - "pending"
                    - "completed"
                    - "failed"
                    example: "completed"
                    type: "string"
                  from_account_id:
                    description: "The UUID of the source account"
                    example: "123e4567-e89b-12d3-a456-426614174000"
                    type: "string"
                  to_account_id:
                    description: "The UUID of the destination account"
                    example: "987fcdeb-51a2-43e7-89bc-765432198765"
                    type: "string"
                  amount:
                    description: "The amount transferred"
                    example: 100.0
                    type: "number"
                  timestamp:
                    description: "The timestamp when the transfer was initiated"
                    example: "2024-01-15T14:30:00Z"
                    type: "string"
                    format: "date-time"
        400:
          description: "Invalid transfer request"
          content:
            application/json:
              schema:
                description: "Standard error response structure for all error scenarios"
                x-amf-examples:
                  example_0:
                    error_code: "BAD_REQUEST"
                    message: "Validation Error Amount must not have more than 2 decimal\
                      \ places"
                  validation_error:
                    error_code: "BAD_REQUEST"
                    message: "Validation Error Amount must not have more that two\
                      \ decimal places"
                  same_account:
                    error_code: "BAD_REQUEST"
                    message: "Validation Error Can not transfer to the same account"
                  account_not_found:
                    error_code: "NOT_FOUND"
                    message: "Account Not found Account does not exist"
                  insufficient_funds:
                    error_code: "UNPROCESSABLE_ENTITY"
                    message: "Insufficient Funds Account balance too low"
                  internal_error:
                    error_code: "INTERNAL_ERROR"
                    message: "Internal Error Failed to process transfer"
                  not_found:
                    error_code: "NOT_FOUND"
                    message: "Transfer Error Transfer 123e4567-e89b-12d3-a456-426614174000\
                      \ Not Found"
                  lock_error:
                    error_code: "INTERNAL_ERROR"
                    message: "Lock Error Failed to acquire lock"
                type: "object"
                additionalProperties: true
                required:
                - "error_code"
                - "message"
                properties:
                  error_code:
                    description: "A standardized error code identifying the type of\
                      \ error"
                    enum:
                    - "BAD_REQUEST"
                    - "NOT_FOUND"
                    - "INTERNAL_ERROR"
                    - "UNPROCESSABLE_ENTITY"
                    example: "BAD_REQUEST"
                    type: "string"
                  message:
                    description: "A human-readable description of the error"
                    example: "Validation Error Amount must not have more than 2 decimal\
                      \ places"
                    type: "string"
        404:
          description: "Source or destination account not found"
          content:
            application/json:
              schema:
                description: "Standard error response structure for all error scenarios"
                x-amf-examples:
                  example_0:
                    error_code: "BAD_REQUEST"
                    message: "Validation Error Amount must not have more than 2 decimal\
                      \ places"
                  validation_error:
                    error_code: "BAD_REQUEST"
                    message: "Validation Error Amount must not have more that two\
                      \ decimal places"
                  same_account:
                    error_code: "BAD_REQUEST"
                    message: "Validation Error Can not transfer to the same account"
                  account_not_found:
                    error_code: "NOT_FOUND"
                    message: "Account Not found Account does not exist"
                  insufficient_funds:
                    error_code: "UNPROCESSABLE_ENTITY"
                    message: "Insufficient Funds Account balance too low"
                  internal_error:
                    error_code: "INTERNAL_ERROR"
                    message: "Internal Error Failed to process transfer"
                  not_found:
                    error_code: "NOT_FOUND"
                    message: "Transfer Error Transfer 123e4567-e89b-12d3-a456-426614174000\
                      \ Not Found"
                  lock_error:
                    error_code: "INTERNAL_ERROR"
                    message: "Lock Error Failed to acquire lock"
                type: "object"
                additionalProperties: true
                required:
                - "error_code"
                - "message"
                properties:
                  error_code:
                    description: "A standardized error code identifying the type of\
                      \ error"
                    enum:
                    - "BAD_REQUEST"
                    - "NOT_FOUND"
                    - "INTERNAL_ERROR"
                    - "UNPROCESSABLE_ENTITY"
                    example: "BAD_REQUEST"
                    type: "string"
                  message:
                    description: "A human-readable description of the error"
                    example: "Validation Error Amount must not have more than 2 decimal\
                      \ places"
                    type: "string"
        422:
          description: "Transfer cannot be processed"
          content:
            application/json:
              schema:
                description: "Standard error response structure for all error scenarios"
                x-amf-examples:
                  example_0:
                    error_code: "BAD_REQUEST"
                    message: "Validation Error Amount must not have more than 2 decimal\
                      \ places"
                  validation_error:
                    error_code: "BAD_REQUEST"
                    message: "Validation Error Amount must not have more that two\
                      \ decimal places"
                  same_account:
                    error_code: "BAD_REQUEST"
                    message: "Validation Error Can not transfer to the same account"
                  account_not_found:
                    error_code: "NOT_FOUND"
                    message: "Account Not found Account does not exist"
                  insufficient_funds:
                    error_code: "UNPROCESSABLE_ENTITY"
                    message: "Insufficient Funds Account balance too low"
                  internal_error:
                    error_code: "INTERNAL_ERROR"
                    message: "Internal Error Failed to process transfer"
                  not_found:
                    error_code: "NOT_FOUND"
                    message: "Transfer Error Transfer 123e4567-e89b-12d3-a456-426614174000\
                      \ Not Found"
                  lock_error:
                    error_code: "INTERNAL_ERROR"
                    message: "Lock Error Failed to acquire lock"
                type: "object"
                additionalProperties: true
                required:
                - "error_code"
                - "message"
                properties:
                  error_code:
                    description: "A standardized error code identifying the type of\
                      \ error"
                    enum:
                    - "BAD_REQUEST"
                    - "NOT_FOUND"
                    - "INTERNAL_ERROR"
                    - "UNPROCESSABLE_ENTITY"
                    example: "BAD_REQUEST"
                    type: "string"
                  message:
                    description: "A human-readable description of the error"
                    example: "Validation Error Amount must not have more than 2 decimal\
                      \ places"
                    type: "string"
        500:
          description: "Internal server error"
          content:
            application/json:
              schema:
                description: "Standard error response structure for all error scenarios"
                x-amf-examples:
                  example_0:
                    error_code: "BAD_REQUEST"
                    message: "Validation Error Amount must not have more than 2 decimal\
                      \ places"
                  validation_error:
                    error_code: "BAD_REQUEST"
                    message: "Validation Error Amount must not have more that two\
                      \ decimal places"
                  same_account:
                    error_code: "BAD_REQUEST"
                    message: "Validation Error Can not transfer to the same account"
                  account_not_found:
                    error_code: "NOT_FOUND"
                    message: "Account Not found Account does not exist"
                  insufficient_funds:
                    error_code: "UNPROCESSABLE_ENTITY"
                    message: "Insufficient Funds Account balance too low"
                  internal_error:
                    error_code: "INTERNAL_ERROR"
                    message: "Internal Error Failed to process transfer"
                  not_found:
                    error_code: "NOT_FOUND"
                    message: "Transfer Error Transfer 123e4567-e89b-12d3-a456-426614174000\
                      \ Not Found"
                  lock_error:
                    error_code: "INTERNAL_ERROR"
                    message: "Lock Error Failed to acquire lock"
                type: "object"
                additionalProperties: true
                required:
                - "error_code"
                - "message"
                properties:
                  error_code:
                    description: "A standardized error code identifying the type of\
                      \ error"
