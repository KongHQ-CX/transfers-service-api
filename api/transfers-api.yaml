                    type: "string"
                  message:
                    description: "A human-readable description of the error"
                    example: "Validation Error Amount must not have more than 2 decimal\
                      \ places"
                    type: "string"
  /transfers/{transferId}:
    x-amf-displayName: "Transfer by ID"
    parameters:
    - name: "transferId"
      description: "The UUID of the transfer to retrieve"
      required: true
      in: "path"
      schema:
        description: "The UUID of the transfer to retrieve"
        example: "123e4567-e89b-12d3-a456-426614174000"
        type: "string"
    get:
      operationId: "Retrieve transfer details"
      description: "Returns the status and details of a previously initiated transfer"
      responses:
        200:
          description: "Transfer details retrieved successfully"
          content:
            application/json:
              schema:
                description: "Represents a transfer between accounts including its\
                  \ current status"
                x-amf-examples:
                  example_0:
                    transfer_id: "txf-123e4567-e89b-12d3-a456-426614174000"
                    status: "completed"
                    from_account_id: "123e4567-e89b-12d3-a456-426614174000"
                    to_account_id: "987fcdeb-51a2-43e7-89bc-765432198765"
                    amount: 100.0
                    timestamp: "2024-01-15T14:30:00Z"
                  successful_transfer:
                    transfer_id: "txf-123e4567-e89b-12d3-a456-426614174000"
                    status: "completed"
                    from_account_id: "123e4567-e89b-12d3-a456-426614174000"
                    to_account_id: "987fcdeb-51a2-43e7-89bc-765432198765"
                    amount: 100.0
                    timestamp: "2024-01-15T14:30:00Z"
                  completed_transfer:
                    transfer_id: "txf-123e4567-e89b-12d3-a456-426614174000"
                    status: "completed"
                    from_account_id: "123e4567-e89b-12d3-a456-426614174000"
                    to_account_id: "987fcdeb-51a2-43e7-89bc-765432198765"
                    amount: 100.0
                    timestamp: "2024-01-15T14:30:00Z"
                type: "object"
                additionalProperties: true
                required:
                - "transfer_id"
                - "status"
                - "from_account_id"
                - "to_account_id"
                - "amount"
                - "timestamp"
                properties:
                  transfer_id:
                    description: "Unique identifier for the transfer (UUID v4)"
                    example: "txf-123e4567-e89b-12d3-a456-426614174000"
                    type: "string"
                  status:
                    description: "The current status of the transfer"
                    enum:
                    - "pending"
                    - "completed"
                    - "failed"
                    example: "completed"
                    type: "string"
                  from_account_id:
